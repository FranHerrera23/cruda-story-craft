<svg xmlns="http://www.w3.org/2000/svg" width="800" height="630" viewBox="0 0 800 630"><rect width="100%" height="100%" fill="white"/><text x="32" y="42" font-family="Arial,sans-serif" font-size="17" fill="#555" font-weight="700">CRUDA / THE BUSINESS BEHIND THE POST</text><text x="32" y="95" font-family="Arial,sans-serif" font-size="35" fill="#111" font-weight="700">Being seen. Being remembered.</text><path d="M32 140H768" stroke="#ccc"/><text x="32" y="170" font-family="Arial,sans-serif" font-size="18" fill="#666" font-weight="700">01 / DISCOVERY</text><text x="32" y="210" font-family="Arial,sans-serif" font-size="26" fill="#111" font-weight="700">Tuesday: someone sees the restaurant.</text><text x="32" y="246" font-family="Arial,sans-serif" font-size="22" fill="#111" font-weight="400">They have already eaten. They do not order.</text><path d="M32 285H768" stroke="#ccc"/><text x="32" y="315" font-family="Arial,sans-serif" font-size="18" fill="#666" font-weight="700">02 / MEMORY</text><text x="32" y="355" font-family="Arial,sans-serif" font-size="26" fill="#111" font-weight="700">Friday: “Where can we eat together?”</text><text x="32" y="391" font-family="Arial,sans-serif" font-size="22" fill="#111" font-weight="400">Does your restaurant come to mind?</text><path d="M32 430H768" stroke="#ccc"/><text x="32" y="460" font-family="Arial,sans-serif" font-size="18" fill="#666" font-weight="700">03 / EXPERIENCE</text><text x="32" y="500" font-family="Arial,sans-serif" font-size="26" fill="#111" font-weight="700">They choose you. Now you have to deliver.</text><text x="32" y="536" font-family="Arial,sans-serif" font-size="22" fill="#111" font-weight="400">The offer, price and service still matter.</text><text x="32" y="605" font-family="Arial,sans-serif" font-size="18" fill="#666" font-weight="400">Hypothetical example · CRUDA</text></svg>