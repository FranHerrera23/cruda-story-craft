<svg xmlns="http://www.w3.org/2000/svg" width="800" height="630" viewBox="0 0 800 630"><rect width="100%" height="100%" fill="white"/><text x="32" y="42" font-family="Arial,sans-serif" font-size="17" fill="#555" font-weight="700">CRUDA / EL NEGOCIO DETRÁS DEL POST</text><text x="32" y="95" font-family="Arial,sans-serif" font-size="35" fill="#111" font-weight="700">Que te vean. Que te recuerden.</text><path d="M32 140H768" stroke="#ccc"/><text x="32" y="170" font-family="Arial,sans-serif" font-size="18" fill="#666" font-weight="700">01 / DESCUBRIMIENTO</text><text x="32" y="210" font-family="Arial,sans-serif" font-size="26" fill="#111" font-weight="700">Martes: alguien descubre el local.</text><text x="32" y="246" font-family="Arial,sans-serif" font-size="22" fill="#111" font-weight="400">Ya almorzó. No hace un pedido.</text><path d="M32 285H768" stroke="#ccc"/><text x="32" y="315" font-family="Arial,sans-serif" font-size="18" fill="#666" font-weight="700">02 / RECUERDO</text><text x="32" y="355" font-family="Arial,sans-serif" font-size="26" fill="#111" font-weight="700">Viernes: «¿Dónde podemos comer todos?»</text><text x="32" y="391" font-family="Arial,sans-serif" font-size="22" fill="#111" font-weight="400">¿Aparece tu hamburguesería en la conversación?</text><path d="M32 430H768" stroke="#ccc"/><text x="32" y="460" font-family="Arial,sans-serif" font-size="18" fill="#666" font-weight="700">03 / EXPERIENCIA</text><text x="32" y="500" font-family="Arial,sans-serif" font-size="26" fill="#111" font-weight="700">Te eligen. Ahora tenés que cumplir.</text><text x="32" y="536" font-family="Arial,sans-serif" font-size="22" fill="#111" font-weight="400">La oferta, el precio y el servicio siguen importando.</text><text x="32" y="605" font-family="Arial,sans-serif" font-size="18" fill="#666" font-weight="400">Ejemplo hipotético · CRUDA</text></svg>