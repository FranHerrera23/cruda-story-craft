<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" fill="#faf9f6"/><text x="60" y="80" font-family="Arial,sans-serif" font-size="24" fill="#111">What should change after the research?</text><rect x="60" y="160" width="330" height="280" rx="8" fill="white" stroke="#b8b8b3"/><rect x="60" y="160" width="330" height="6" fill="#111"/><text x="82" y="225" font-family="Arial,sans-serif" font-size="25" font-weight="700">The assumption</text><text x="82" y="295" font-family="Arial,sans-serif" font-size="22"><tspan x="82">They buy our equipment.</tspan><tspan x="82" dy="36">Will they buy the service?</tspan></text><rect x="435" y="160" width="330" height="280" rx="8" fill="white" stroke="#b8b8b3"/><rect x="435" y="160" width="330" height="6" fill="#111"/><text x="457" y="225" font-family="Arial,sans-serif" font-size="25" font-weight="700">The actual purchase</text><text x="457" y="295" font-family="Arial,sans-serif" font-size="22"><tspan x="457">Who calls, compares,</tspan><tspan x="457" dy="36">and approves the expense.</tspan></text><rect x="810" y="160" width="330" height="280" rx="8" fill="white" stroke="#b8b8b3"/><rect x="810" y="160" width="330" height="6" fill="#111"/><text x="832" y="225" font-family="Arial,sans-serif" font-size="25" font-weight="700">The first test</text><text x="832" y="295" font-family="Arial,sans-serif" font-size="22"><tspan x="832">Offer, price, coverage,</tspan><tspan x="832" dy="36">and specific conditions.</tspan></text></svg>