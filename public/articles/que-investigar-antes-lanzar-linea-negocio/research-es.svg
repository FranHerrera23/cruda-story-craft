<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" fill="#faf9f6"/><text x="60" y="80" font-family="Arial,sans-serif" font-size="24" fill="#111">¿Qué tiene que cambiar después de investigar?</text><rect x="60" y="160" width="330" height="280" rx="8" fill="white" stroke="#b8b8b3"/><rect x="60" y="160" width="330" height="6" fill="#111"/><text x="82" y="225" font-family="Arial,sans-serif" font-size="25" font-weight="700">La suposición</text><text x="82" y="295" font-family="Arial,sans-serif" font-size="22"><tspan x="82">Ya nos compran equipos.</tspan><tspan x="82" dy="36">¿Comprarán el servicio?</tspan></text><rect x="435" y="160" width="330" height="280" rx="8" fill="white" stroke="#b8b8b3"/><rect x="435" y="160" width="330" height="6" fill="#111"/><text x="457" y="225" font-family="Arial,sans-serif" font-size="25" font-weight="700">La compra real</text><text x="457" y="295" font-family="Arial,sans-serif" font-size="22"><tspan x="457">Quién llama, compara</tspan><tspan x="457" dy="36">y aprueba el gasto.</tspan></text><rect x="810" y="160" width="330" height="280" rx="8" fill="white" stroke="#b8b8b3"/><rect x="810" y="160" width="330" height="6" fill="#111"/><text x="832" y="225" font-family="Arial,sans-serif" font-size="25" font-weight="700">La primera prueba</text><text x="832" y="295" font-family="Arial,sans-serif" font-size="22"><tspan x="832">Oferta, precio, cobertura</tspan><tspan x="832" dy="36">y condiciones concretas.</tspan></text></svg>